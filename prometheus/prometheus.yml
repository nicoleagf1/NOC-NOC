global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Monitoreo del propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Monitoreo del servidor principal (Linux) vía Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. ¡EL MÁS IMPORTANTE! Descubrimiento de tus servidores Windows/Linux registrados en NOC-NOC
  - job_name: 'noc-noc-hosts'
    http_sd_configs:
      - url: 'http://noc-noc-app:3000/api/discovery/prometheus'
        basic_auth:
          username: 'prometheus'
          password: 'secret123'

  # 4. Monitoreo de Firewall Fortigate (Métricas WAN, CPU, Memoria, Interfaces)
  - job_name: 'fortigate'
    metrics_path: /probe
    static_configs:
      - targets:
        - IP_DEL_FORTIGATE  # Reemplazar con la misma IP que pusiste en fortigate.yaml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: fortigate-exporter:9710
